<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>堺LP｜4つのデザイン比較</title>
<style>
* { box-sizing:border-box; }
body { margin:0; font:500 1rem/1.65 "Yu Gothic",Meiryo,sans-serif; color:#242735; background:#f6f6f3; }
main { width:min(93%,86rem); margin:auto; padding:clamp(1.2rem,3vw,3rem) 0; }
header { display:flex; align-items:end; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:1.7rem; }
header p, h1, h2, article p { margin:0; }
header p { font-weight:700; }
h1 { font:750 clamp(1.8rem,3.4vw,3.2rem)/1.4 "Yu Mincho",serif; letter-spacing:-.055em; }
fieldset { display:flex; align-items:center; flex-wrap:wrap; gap:.2rem .8rem; padding:0; border:0; margin:0; }
legend { padding:0; font-size:.9rem; }
label { display:inline-flex; align-items:center; gap:.2em; min-height:44px; cursor:pointer; }
.catalog { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(1.1rem,2vw,2.1rem); align-items:start; }
article { border:1px solid #c9caca; border-radius:.45rem; background:white; min-width:0; }
article .cover { display:block; border-bottom:1px solid #d3d6d8; }
.cover img { display:block; width:100%; height:auto; aspect-ratio: 1.9; object-fit:cover; object-position:top center; border-radius:.4rem .4rem 0 0; }
.copy { padding:1rem clamp(1rem,2.4vw,1.9rem); }
h2 { font-size:clamp(1.16rem,1.7vw,1.55rem); letter-spacing:-.035em; }
h2 span { margin-right:.5em; font:italic 1em Georgia,serif; }
article p { margin:.2rem 0; }
.open { display:inline-flex; align-items:center; min-height:46px; font-weight:750; color:#214b69; text-underline-offset:.25em; }
.screen { display:none; width:100%; overflow:auto; background:#e9ebeb; border-top:1px solid #c9caca; }
iframe { display:block; border:0; height:715px; max-width:100%; margin-inline:auto; background:white; }
body:has(#narrow:checked,#mobile:checked) .cover { display:none; }
body:has(#narrow:checked,#mobile:checked) .screen { display:block; }
body:has(#narrow:checked) iframe { width:320px; }
body:has(#mobile:checked) iframe { width:390px; }
:focus-visible { outline:3px solid #075bba; outline-offset:3px; }
@media(max-width:48rem){ .catalog{grid-template-columns:1fr;} }
</style>
</head>
<body><main><header><div><p>enzine room 堺</p><h1>4つのLPを見比べる</h1></div>
<fieldset><legend>プレビュー</legend>
<label><input type="radio" name="mode" id="covers" checked>全案の表紙</label><label><input type="radio" name="mode" id="narrow">スマホ 320px</label><label><input type="radio" name="mode" id="mobile">スマホ 390px</label></fieldset></header>
<div class="catalog">
  <article><a class="cover" href="index.html" aria-label="A案の表紙からLPを開く"><img src="assets/preview-wonder.jpg" alt="" width="1225" height="692"></a>
    <div class="copy"><h2><span>A</span>ワンダーLand参考</h2><p>淡い虹色と金の丸枠。見学相談とアクセスを先に確認できます。</p><a class="open" href="index.html">A案のLPを開く</a></div>
    <div class="screen"><iframe title="A案のスマートフォン表示" loading="lazy" src="index.html"></iframe></div></article>
  <article><a class="cover" href="access.html" aria-label="B案の表紙からLPを開く"><img src="assets/preview-college.jpg" alt="" width="1225" height="692"></a>
    <div class="copy"><h2><span>B</span>チャレンズ南森町校参考</h2><p>作業写真に紺・オレンジの見出し。時間・送迎・食事・交通費を続けて案内します。</p><a class="open" href="access.html">B案のLPを開く</a></div>
    <div class="screen"><iframe title="B案のスマートフォン表示" loading="lazy" src="access.html"></iframe></div></article>
  <article><a class="cover" href="activities.html" aria-label="C案の表紙からLPを開く"><img src="assets/preview-jam.jpg" alt="" width="1225" height="692"></a>
    <div class="copy"><h2><span>C</span>MUSIC JAM参考</h2><p>アニメの表紙から見本ギャラリーへ。絵・音・映像に関わる作業を紹介します。</p><a class="open" href="activities.html">C案のLPを開く</a></div>
    <div class="screen"><iframe title="C案のスマートフォン表示" loading="lazy" src="activities.html"></iframe></div></article>
  <article><a class="cover" href="stage.html" aria-label="D案の表紙からLPを開く"><img src="assets/preview-stage.jpg" alt="" width="1225" height="692"></a>
    <div class="copy"><h2><span>D</span>添付画像参考</h2><p>シアンと黄緑の斜め見出し。声で表現する側と、編集で支える側から活動を選べます。</p><a class="open" href="stage.html">D案のLPを開く</a></div>
    <div class="screen"><iframe title="D案のスマートフォン表示" loading="lazy" src="stage.html"></iframe></div></article>
</div></main></body></html>
